name: Direct read window experiment
on: workflow_dispatch
permissions:
  contents: read
jobs:
  direct-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, 1.85.0]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build direct READ diagnostic
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build --release --locked --features io-uring --example direct_read_cost
      - name: Measure ext4 direct reads on a RAM-backed loop device
        shell: bash
        run: |
          sudo sysctl -w kernel.io_uring_disabled=0
          dir="$RUNNER_TEMP/direct-ext4"
          backing="$RUNNER_TEMP/ram-block"
          mkdir -p "$dir" "$backing"
          sudo mount -t tmpfs -o size=768M tmpfs "$backing"
          sudo truncate -s 512M "$backing/ext4.img"
          sudo mkfs.ext4 -q -F "$backing/ext4.img"
          sudo mount -o loop "$backing/ext4.img" "$dir"
          sudo chown "$(id -u):$(id -g)" "$dir"
          findmnt -n -o SOURCE,FSTYPE,OPTIONS -T "$backing/ext4.img"
          losetup --list --output NAME,BACK-FILE,DIO
          findmnt -n -o SOURCE,FSTYPE,OPTIONS -T "$dir"
          lscpu
          uname -a
          cat /proc/sys/kernel/random/boot_id
          ulimit -l
          sudo prlimit --pid "$$" --memlock=134217728:134217728
          ulimit -l
          rustc -Vv
          python3 -B benches/rolling_read_cost.py target/release/examples/direct_read_cost "$dir" "$RUNNER_TEMP/read-costs"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ram-loop-${{ matrix.rust }}
          path: ${{ runner.temp }}/read-costs/
          if-no-files-found: error
