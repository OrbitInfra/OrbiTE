name: Validate protected single 64 MiB ext4 READs on crossed x86 hosts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: stable-first
            first: stable
            second: 1.85.0
          - slot: msrv-first
            first: 1.85.0
            second: stable
    env:
      RUNNER_SLOT: ${{ matrix.slot }}
      CC: gcc
      CXX: g++
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CLANG_PATH: /usr/bin/clang-18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing x86_64 ext4 and io_uring facilities
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/probe-ext4"
          findmnt -n -o FSTYPE,SOURCE,TARGET,OPTIONS -T "$RUNNER_TEMP/probe-ext4" | tee "$RUNNER_TEMP/receipts/mount.txt"
          if test "$(findmnt -n -o FSTYPE -T "$RUNNER_TEMP/probe-ext4")" != ext4; then
            echo "::error::No writable ext4 at RUNNER_TEMP on this runner."
            exit 1
          fi
          if test -r /proc/sys/kernel/io_uring_disabled; then cat /proc/sys/kernel/io_uring_disabled | tee "$RUNNER_TEMP/receipts/kernel-io-uring-disabled.txt"; fi
          cc -Wall -Wextra -Werror -O2 -x c -o "$RUNNER_TEMP/check-ring" - <<'C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <linux/io_uring.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          int main(void) {
              struct io_uring_params p = {0};
              int fd = (int)syscall(SYS_io_uring_setup, 2U, &p);
              if (fd < 0) {
                  int reason = errno;
                  fprintf(stderr, "native io_uring unavailable: errno=%d (%s)\n", reason, strerror(reason));
                  return 1;
              }
              return close(fd) == 0 ? 0 : 1;
          }
          C
          "$RUNNER_TEMP/check-ring" 2>&1 | tee "$RUNNER_TEMP/receipts/ring-probe.log"
      - name: Build the frozen native TENT oracle
        id: oracle
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/install-native-deps.sh cmake g++ git curl time strace python3-dev libgoogle-glog-dev libgflags-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libibverbs-dev libcurl4-openssl-dev libssl-dev libcli11-dev liburing-dev clang-18 libclang-18-dev
          python3 tests/reference/run.py --fetch-reference --output "$RUNNER_TEMP/oracle"
          python3 -I -B tests/reference/test_manifest.py "$RUNNER_TEMP/oracle/manifest.json"
      - name: Record existing memory-lock limits and fixed-buffer feasibility
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/receipts"
          ulimit -Sl > "$out/memlock-soft-kib.txt"
          ulimit -Hl > "$out/memlock-hard-kib.txt"
          awk '$1 == "CapEff:" {print $0}' /proc/self/status > "$out/effective-capabilities.txt"
          cc -std=c11 -O2 -Wall -Wextra -Werror benches/single_registered.c -luring -o "$RUNNER_TEMP/single-buffer-control"
          small=0
          "$RUNNER_TEMP/single-buffer-control" "$RUNNER_TEMP/probe-ext4/small-fixed-control" 4 > "$out/fixed-buffer-4MiB.log" 2>&1 || small=$?
          echo "$small" > "$out/fixed-buffer-4MiB-exit.txt"
          case "$small" in
            0|10) ;;
            *) cat "$out/fixed-buffer-4MiB.log"; exit "$small" ;;
          esac
          rc=0
          "$RUNNER_TEMP/single-buffer-control" "$RUNNER_TEMP/probe-ext4/fixed-buffer-feasibility" 64 > "$out/fixed-buffer-probe.log" 2>&1 || rc=$?
          echo "$rc" > "$out/fixed-buffer-exit.txt"
          case "$rc" in
            0|10) ;;
            *) cat "$out/fixed-buffer-probe.log"; exit "$rc" ;;
          esac
      - name: Build the frozen caller and single-read owners on the first compiler
        id: build_first
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          JOB_TOOLCHAIN: ${{ matrix.first }}
        run: |
          set -euo pipefail
          rustup toolchain install "$JOB_TOOLCHAIN" --profile minimal
          out="$RUNNER_TEMP/single-$JOB_TOOLCHAIN/receipts"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/receipts/"* "$out/"
          python3 -B benches/single_hosted.py build
      - name: Measure first compiler with the frozen public callers
        if: ${{ !cancelled() && steps.build_first.outcome == 'success' }}
        env:
          JOB_TOOLCHAIN: ${{ matrix.first }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/single-$JOB_TOOLCHAIN/receipts"
          python3 -B benches/single_hosted.py controls
          python3 -B benches/single_hosted.py measure
          python3 -B benches/single_replay.py "$out" formal > "$out/recalculated.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: single-formal-${{ matrix.slot }}-${{ matrix.first }}
          path: ${{ runner.temp }}/single-${{ matrix.first }}/receipts/
          if-no-files-found: warn
      - name: Measure single-read phases and residency on the first compiler
        if: ${{ !cancelled() && steps.build_first.outcome == 'success' }}
        env:
          JOB_TOOLCHAIN: ${{ matrix.first }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/single-$JOB_TOOLCHAIN/profile"
          python3 -B benches/single_hosted.py profile
          python3 -B benches/single_replay.py "$out" profile > "$out/recalculated.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: single-profile-${{ matrix.slot }}-${{ matrix.first }}
          path: ${{ runner.temp }}/single-${{ matrix.first }}/profile/
          if-no-files-found: warn
      - name: Retire temporary first compiler build outputs
        if: always()
        env:
          JOB_TOOLCHAIN: ${{ matrix.first }}
        run: |
          python3 -B - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / ("single-" + os.environ["JOB_TOOLCHAIN"])
          for target in path.glob("target-*"):
              if target.is_dir() and not target.is_symlink():
                  shutil.rmtree(target)
          PYCODE
      - name: Build the frozen caller and single-read owners on the second compiler
        id: build_second
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          JOB_TOOLCHAIN: ${{ matrix.second }}
        run: |
          set -euo pipefail
          rustup toolchain install "$JOB_TOOLCHAIN" --profile minimal
          out="$RUNNER_TEMP/single-$JOB_TOOLCHAIN/receipts"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/receipts/"* "$out/"
          python3 -B benches/single_hosted.py build
      - name: Measure second compiler with the frozen public callers
        if: ${{ !cancelled() && steps.build_second.outcome == 'success' }}
        env:
          JOB_TOOLCHAIN: ${{ matrix.second }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/single-$JOB_TOOLCHAIN/receipts"
          python3 -B benches/single_hosted.py controls
          python3 -B benches/single_hosted.py measure
          python3 -B benches/single_replay.py "$out" formal > "$out/recalculated.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: single-formal-${{ matrix.slot }}-${{ matrix.second }}
          path: ${{ runner.temp }}/single-${{ matrix.second }}/receipts/
          if-no-files-found: warn
      - name: Measure single-read phases and residency on the second compiler
        if: ${{ !cancelled() && steps.build_second.outcome == 'success' }}
        env:
          JOB_TOOLCHAIN: ${{ matrix.second }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/single-$JOB_TOOLCHAIN/profile"
          python3 -B benches/single_hosted.py profile
          python3 -B benches/single_replay.py "$out" profile > "$out/recalculated.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: single-profile-${{ matrix.slot }}-${{ matrix.second }}
          path: ${{ runner.temp }}/single-${{ matrix.second }}/profile/
          if-no-files-found: warn
  verdict:
    runs-on: ubuntu-24.04
    needs: matched
    if: always()
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: single-formal-*
          path: ${{ runner.temp }}/comparisons
      - name: Apply frozen baselines and the hot buffer memory limit
        run: python3 -B benches/single_status.py "$RUNNER_TEMP/comparisons"
