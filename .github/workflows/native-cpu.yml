name: Direct read window experiment
on: workflow_dispatch
permissions:
  contents: read
jobs:
  direct-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, 1.85.0]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build direct READ diagnostic
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build --release --locked --features io-uring --example direct_read_cost
      - name: Measure real ext4 direct reads
        shell: bash
        run: |
          sudo sysctl -w kernel.io_uring_disabled=0
          dir="$RUNNER_TEMP/direct-ext4"
          mkdir -p "$dir"
          if [[ "$(findmnt -n -o FSTYPE -T "$dir")" != ext4 ]]; then
            truncate -s 512M "$RUNNER_TEMP/direct-ext4.img"
            mkfs.ext4 -q -F "$RUNNER_TEMP/direct-ext4.img"
            sudo mount -o loop "$RUNNER_TEMP/direct-ext4.img" "$dir"
            sudo chown "$(id -u):$(id -g)" "$dir"
          fi
          findmnt -n -o SOURCE,FSTYPE,OPTIONS -T "$dir"
          lscpu
          uname -a
          cat /proc/sys/kernel/random/boot_id
          ulimit -l
          sudo prlimit --pid "$$" --memlock=134217728:134217728
          ulimit -l
          rustc -Vv
          python3 -B benches/large_pipe_cost.py target/release/examples/direct_read_cost "$dir" "$RUNNER_TEMP/read-costs"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: direct-cost-${{ matrix.rust }}
          path: ${{ runner.temp }}/read-costs/
          if-no-files-found: error
