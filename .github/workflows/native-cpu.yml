name: Compare large direct READ confirmed copy
on: workflow_dispatch
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build plain fixed, PR and candidate engines on both compilers
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/fixed" 12d1e83964a596d9b578e9d2879b5cd78e776da6
          git worktree add --detach "$RUNNER_TEMP/head" ea265fdecbea48e4f05dff32314f966251943f52
          git worktree add --detach "$RUNNER_TEMP/candidate" 9066bdd785645cad6118ca1fd74e4dc1bc3d607f
          cmp "$RUNNER_TEMP/head/benches/transfer.rs" "$RUNNER_TEMP/candidate/benches/transfer.rs"
          for tc in stable 1.85.0; do
            rustup toolchain install "$tc" --profile minimal
            for g in fixed head candidate candidate-slot; do
              work="$RUNNER_TEMP/$g"
              wrapper=()
              if [[ "$g" == fixed ]]; then caller="$RUNNER_TEMP/head/benches"; wrapper=("RUSTC_WORKSPACE_WRAPPER=$caller/build_caller.py"); fi
              if [[ "$g" == candidate-slot ]]; then work="$RUNNER_TEMP/candidate"; caller="$GITHUB_WORKSPACE/benches"; wrapper=("RUSTC_WORKSPACE_WRAPPER=$caller/build_caller.py"); fi
              (cd "$work" && git diff --quiet HEAD && env "${wrapper[@]}" CARGO_TARGET_DIR="$RUNNER_TEMP/build-$tc-$g" cargo +"$tc" build --release --locked --features io-uring --bench transfer --message-format=json) > "$RUNNER_TEMP/build.jsonl"
              jq -r 'select(.target.name=="transfer" and .executable!=null)|.executable' "$RUNNER_TEMP/build.jsonl" > "$RUNNER_TEMP/$tc-$g.exe"
              if [[ "$g" == fixed || "$g" == candidate-slot ]]; then
                PYTHONPATH=benches python3 -B -c 'from run import check_caller_dep_info; from pathlib import Path; import sys; exe=Path(Path(sys.argv[1]).read_text().strip()); check_caller_dep_info(exe.with_suffix(".d").read_text(),exe,Path(sys.argv[2]))' "$RUNNER_TEMP/$tc-$g.exe" "$caller/transfer.rs"
              fi
            done
          done
      - name: Compare matched public READs on ext4
        shell: bash
        run: |
          if test -e /proc/sys/kernel/io_uring_disabled; then sudo sysctl -w kernel.io_uring_disabled=0; fi
          dir="$RUNNER_TEMP/direct-ext4"
          mkdir -p "$dir"
          if [[ "$(findmnt -n -o FSTYPE -T "$dir")" != ext4 ]]; then
            truncate -s 512M "$RUNNER_TEMP/direct-ext4.img"
            mkfs.ext4 -q -F "$RUNNER_TEMP/direct-ext4.img"
            sudo mount -o loop "$RUNNER_TEMP/direct-ext4.img" "$dir"
            sudo chown "$(id -u):$(id -g)" "$dir"
          fi
          python3 -B bench_probes/matched_copy.py "$dir" "$RUNNER_TEMP/confirmed-copy"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: confirmed-copy
          path: ${{ runner.temp }}/confirmed-copy/
          if-no-files-found: error
