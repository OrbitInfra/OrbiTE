name: Replay large direct READ EIO contract against positive and negative controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Compare real CQE fault control on existing and rolling private owners
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/build"
          export ORBITE_REQUIRE_IO_URING=1 ORBITE_EXT4_DIR="$RUNNER_TEMP/eio-ext4"
          mkdir -p "$ORBITE_EXT4_DIR"
          if [[ "$(findmnt -n -o FSTYPE -T "$ORBITE_EXT4_DIR")" != ext4 ]]; then
            truncate -s 384M "$RUNNER_TEMP/fixture.img"
            mkfs.ext4 -q -F "$RUNNER_TEMP/fixture.img"
            sudo mount -o loop "$RUNNER_TEMP/fixture.img" "$ORBITE_EXT4_DIR"
            sudo chown "$(id -u):$(id -g)" "$ORBITE_EXT4_DIR"
          fi
          findmnt -n -o SOURCE,FSTYPE,TARGET -T "$ORBITE_EXT4_DIR"
          sudo sysctl -w kernel.io_uring_disabled=0
          git worktree add --detach "$RUNNER_TEMP/original" ea265fdecbea48e4f05dff32314f966251943f52
          cp tests/unit/transport/io_uring/{inline.rs,inline_group.rs} "$RUNNER_TEMP/original/tests/unit/transport/io_uring/"
          filter=large_direct_read_with_negative_cqe_preserves_the_entire_destination
          (cd "$RUNNER_TEMP/original" && cargo test --locked --features io-uring --lib "$filter" -- --nocapture) |& tee "$RUNNER_TEMP/green.log"
          grep -F '1 passed' "$RUNNER_TEMP/green.log"
          if cargo test --locked --features io-uring --lib "$filter" -- --nocapture > "$RUNNER_TEMP/red.log" 2>&1; then
            cat "$RUNNER_TEMP/red.log"
            exit 1
          fi
          tail -30 "$RUNNER_TEMP/red.log"
          grep -F 'left: (Failed, 8388608)' "$RUNNER_TEMP/red.log"
          grep -F 'right: (Failed, 0)' "$RUNNER_TEMP/red.log"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: contract-replay
          path: |
            ${{ runner.temp }}/green.log
            ${{ runner.temp }}/red.log
