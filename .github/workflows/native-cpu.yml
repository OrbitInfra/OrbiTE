name: Measure large ext4 direct READ stages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  direct-read-phases:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build both Rust toolchains on the same host
        shell: bash
        run: |
          for tc in stable 1.85.0; do
            rustup toolchain install "$tc" --profile minimal
            CARGO_TARGET_DIR="$RUNNER_TEMP/$tc" cargo +"$tc" build --release --locked --features io-uring --example direct_read_phases
          done
      - name: Separate allocator, page population, kernel completion and confirmed copy
        shell: bash
        run: |
          if test -e /proc/sys/kernel/io_uring_disabled; then sudo sysctl -w kernel.io_uring_disabled=0; fi
          dir="$RUNNER_TEMP/direct-ext4"
          mkdir -p "$dir"
          if [[ "$(findmnt -n -o FSTYPE -T "$dir")" != ext4 ]]; then
            truncate -s 512M "$RUNNER_TEMP/direct-ext4.img"
            mkfs.ext4 -q -F "$RUNNER_TEMP/direct-ext4.img"
            sudo mount -o loop "$RUNNER_TEMP/direct-ext4.img" "$dir"
            sudo chown "$(id -u):$(id -g)" "$dir"
          fi
          python3 -B benches/direct_read_phases.py "$dir" "$RUNNER_TEMP/read-phases"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: direct-read-phases
          path: ${{ runner.temp }}/read-phases/
          if-no-files-found: error
