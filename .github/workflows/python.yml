name: Python wheels

on:
  workflow_call:
    inputs:
      release_gate:
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    # Release PRs run this same job through release.yml, once per revision.
    if: ${{ !startsWith(github.head_ref, 'release/') || inputs.release_gate }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        toolchain: [stable, '1.85.0']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CLANG_PATH: /usr/bin/clang-18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust and native build prerequisites
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
          .github/scripts/install-native-deps.sh g++ cmake pkg-config clang-18 libclang-18-dev libibverbs-dev
          python -m pip install 'maturin==1.10.2' 'patchelf==0.17.2.4'
      - name: Check the optional Python boundary on both feature profiles
        if: matrix.python == '3.13'
        run: |
          for features in '' rdma,cuda,io-uring,gds,metrics,rdma-adaptive; do
            cargo clippy --locked -p orbite-python --features "$features" --all-targets -- -D warnings
            cargo test --locked -p orbite-python --features "$features"
          done
      - name: Reject malformed artifacts even under optimized Python
        run: python -I tests/python/test_artifacts.py -v
      - name: Build and test the installed CPU + io_uring wheel
        run: bash .github/scripts/check-installed-python.sh "$RUNNER_TEMP/wheel-cpu" io-uring
      - name: Run the packaged quickstart without a GPU
        run: |
          if test -e /proc/sys/kernel/io_uring_disabled; then sudo sysctl -w kernel.io_uring_disabled=0; fi
          ORBITE_REQUIRE_IO_URING=1 timeout 120 python -I -m orbite.quickstart
      - name: CPU wheel rejects CUDA exports before requesting a capsule
        run: python -I tests/python/test_cuda_exporters.py --cpu
      - name: Build and test the installed combined-feature wheel
        run: bash .github/scripts/build-manylinux-wheel.sh "$RUNNER_TEMP/wheel-combined" "${{ matrix.python }}"
      - name: Run the publication wheel in a clean container without native libraries
        run: bash .github/scripts/check-clean-wheel.sh "$RUNNER_TEMP/wheel-combined" "${{ matrix.python }}"
      - name: Drive installed CUDA-export owners through the fallible driver table
        run: bash .github/scripts/check-python-cuda.sh "$RUNNER_TEMP/python-cuda-shim"
      - name: Repeat CUDA-export alias, drain and cleanup controls 50 times
        if: matrix.toolchain == 'stable' && matrix.python == '3.13'
        run: bash .github/scripts/check-python-cuda.sh "$RUNNER_TEMP/python-cuda-repeat" 50
      - name: Repeat installed-wheel lifetime and GIL controls
        if: matrix.toolchain == 'stable' && matrix.python == '3.13'
        run: bash .github/scripts/repeat-python.sh "$RUNNER_TEMP/python-repeats"
      - name: Check source distribution contents
        if: matrix.runner == 'ubuntu-24.04' && matrix.toolchain == 'stable' && matrix.python == '3.13'
        run: |
          python -m maturin sdist --out "$RUNNER_TEMP/sdist"
          python scripts/check-python-artifacts.py "$RUNNER_TEMP/sdist"/*.tar.gz
          python -m pip wheel --no-deps --no-build-isolation "$RUNNER_TEMP/sdist"/*.tar.gz --wheel-dir "$RUNNER_TEMP/sdist-wheel"
          python scripts/check-python-artifacts.py "$RUNNER_TEMP/sdist-wheel"/*.whl
          python -m pip install --force-reinstall "$RUNNER_TEMP/sdist-wheel"/*.whl
          python -I tests/python/test_installed.py -v
          ORBITE_REQUIRE_IO_URING=1 timeout 120 python -I -m orbite.quickstart
          python scripts/check-package-contents.py "$RUNNER_TEMP/sdist"/*.tar.gz "$RUNNER_TEMP/sdist-wheel"/*.whl
      - name: Save installable wheels for review (no publication)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: orbite-${{ matrix.runner }}-${{ matrix.python }}-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/wheel-cpu/*.whl
            ${{ runner.temp }}/wheel-combined/*.whl
            ${{ runner.temp }}/sdist/*.tar.gz
            ${{ runner.temp }}/sdist-wheel/*.whl
          if-no-files-found: error
