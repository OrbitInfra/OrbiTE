name: Recover uncreated CI matrix

on:
  workflow_run:
    workflows: [CI, Python wheels, Frozen TENT CPU comparison, Documentation, Native runtime isolation, Release preparation]
    types: [completed]

# No checkout, secrets, artifacts or PR code are consumed. Publication workflows
# are excluded except PR dry runs: registries must never be retried automatically.
permissions:
  actions: write

concurrency:
  group: recover-empty-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = context.payload.workflow_run.id;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (run.status !== 'completed' || run.conclusion !== 'failure' || run.run_attempt !== 1) {
              core.info('Not an initial completed failure; no rerun.');
              return;
            }
            if (run.name === 'Release preparation' && run.event !== 'pull_request') {
              core.info('Tag and dispatched release runs require manual receipt review; no rerun.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              {owner, repo, run_id, attempt_number: 1, per_page: 100});
            if (jobs.some(job => job.status !== 'completed' || !['success', 'skipped'].includes(job.conclusion))) {
              core.info('A created job failed, timed out, was cancelled or is unfinished; no rerun.');
              return;
            }
            core.info(`Run ${run_id} failed but none of its ${jobs.length} created jobs failed. Retrying once for the uncreated-matrix/internal-service failure case.`);
            await github.rest.actions.reRunWorkflow({owner, repo, run_id});
